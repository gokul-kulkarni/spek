# TEMPORARY — remove before merging. Manual verification of the composite action for #54, as
# CLAUDE.md requires for changes to the generated HTML's content or to input handling: the smoke
# job in ci.yml covers neither a non-default `title` nor the page's content.
name: Temporary action verification (#54)

on:
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    name: Verify action output (temporary)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # spek-version pinned to the commit under test, as in ci.yml's smoke job: the default
      # "master" would test master's implementation.
      - name: Run the action with a title carrying markup
        id: spek
        uses: ./
        with:
          spek-version: ${{ github.sha }}
          title: "</title><b>R&amp;D"

      - name: Assert the title reads literally and the page structure is intact
        env:
          HTML: ${{ steps.spek.outputs.html-path }}
        run: |
          set -euo pipefail
          if [ ! -s "$HTML" ]; then echo "::error::no file at html-path: $HTML"; exit 1; fi

          expected='<title>&lt;/title&gt;&lt;b&gt;R&amp;amp;D</title>'
          if ! grep -qF -- "$expected" "$HTML"; then
            echo "::error::title not escaped as expected; found:"
            grep -o '<title>[^<]*</title>' "$HTML" || head -c 600 "$HTML"
            exit 1
          fi
          echo "title OK: $expected"

          # Exactly the two closing tags the assembler writes: the escaped payload holds no "<",
          # and the minified bundle writes its own as "<\/script".
          count=$(grep -o -i '</script>' "$HTML" | wc -l)
          echo "</script> occurrences: $count"
          if [ "$count" -ne 2 ]; then echo "::error::expected exactly 2 </script>, got $count"; exit 1; fi

          # This branch's payload carries the change's own artifacts, which contain </script> and
          # <!-- followed by <script> — so the run exercises the payload escape on real content.
          if ! grep -qF 'escape-demo-inline-payload' "$HTML"; then
            echo "::error::the change's artifacts are not in the payload"; exit 1
          fi
          echo "payload carries escape-demo-inline-payload"
