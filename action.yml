name: "spek - OpenSpec Static Site"
description: "Build a static HTML viewer for your OpenSpec documentation"
branding:
  icon: "book-open"
  color: "orange"

inputs:
  repo-path:
    description: "Path to the repository containing openspec/ directory"
    required: false
    default: "."
  output-path:
    description: "Output file path for the generated HTML"
    required: false
    default: "spek-output/spek.html"
  title:
    description: "Page title for the generated HTML"
    required: false
    default: "OpenSpec Viewer"
  spek-version:
    description: "spek version/ref to use (tag, branch, or commit SHA)"
    required: false
    default: "master"
  generate-badges:
    description: "Generate SVG badge files (specs count, open changes, tasks status)"
    required: false
    default: "false"

outputs:
  html-path:
    description: "Absolute path to the generated HTML file"
    value: ${{ steps.build.outputs.html-path }}
  badges-path:
    description: "Absolute path to the generated badges directory"
    value: ${{ steps.badges.outputs.badges-path }}

runs:
  using: "composite"
  steps:
    - name: Checkout spek
      uses: actions/checkout@v7
      with:
        repository: spekhq/spek
        ref: ${{ inputs.spek-version }}
        path: .spek-builder

    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version-file: .spek-builder/.nvmrc

    - name: Cache spek dependencies
      uses: actions/cache@v6
      with:
        path: .spek-builder/node_modules
        key: spek-deps-${{ hashFiles('.spek-builder/package-lock.json') }}

    - name: Install spek dependencies
      shell: bash
      run: npm ci --prefix .spek-builder

    - name: Build @spekjs/core
      shell: bash
      run: npm run build:core --prefix .spek-builder

    # 必須明確 build ui：靜態站的 CSS 由 `@spekjs/ui/styles.css` 進來，而 `npm ci` **不會**
    # 建它（ui 的 build 掛在 `prepublishOnly`，不是 `prepare` —— 掛 `prepare` 會在 workspace
    # symlink 建好之前跑，讓整個 `npm ci` 死掉）。少了這一步，vite 會解析不到
    # `@spekjs/ui/styles.css`，建置失敗。
    - name: Build @spekjs/ui
      shell: bash
      run: npm run build:ui --prefix .spek-builder

    # spek delegates custom-schema artifact ordering to the OpenSpec CLI. Installing it lets
    # the static site reflect the schema's authoritative artifact order. It is optional:
    # if the install fails, the build still succeeds with default (filename) ordering.
    - name: Install OpenSpec CLI (optional, for authoritative artifact ordering)
      shell: bash
      # Pinned for reproducible static-site output: an unpinned install would silently track
      # whatever is latest at build time, so a future CLI JSON change could flip artifact order.
      # Bump this deliberately. If the install fails, the build falls back to default ordering.
      run: npm install -g @fission-ai/openspec@1.5.0 || echo "openspec unavailable; using default artifact order"
      env:
        OPENSPEC_TELEMETRY: "0"
        DO_NOT_TRACK: "1"

    - name: Build OpenSpec static site
      id: build
      shell: bash
      env:
        OPENSPEC_TELEMETRY: "0"
        DO_NOT_TRACK: "1"
        # Inputs reach the script as environment variables, never as text substituted into it: an
        # interpolated input becomes shell source, so a quote in a title broke the build and $(...)
        # in any input ran in the consumer's job (#56). `--` keeps a leading "-" from reading as an
        # option.
        REPO_PATH_INPUT: ${{ inputs.repo-path }}
        OUTPUT_PATH_INPUT: ${{ inputs.output-path }}
        TITLE_INPUT: ${{ inputs.title }}
      run: |
        REPO_DIR=$(realpath -- "$REPO_PATH_INPUT")
        OUTPUT_DIR=$(dirname -- "$OUTPUT_PATH_INPUT")
        mkdir -p -- "$OUTPUT_DIR"
        OUTPUT=$(realpath -- "$OUTPUT_PATH_INPUT")
        # A newline would start another name=value line in $GITHUB_OUTPUT — a forged output. The
        # value is not echoed: printed, the same newline could start a workflow command.
        if [[ "$OUTPUT" == *$'\n'* ]]; then
          echo "::error::output-path resolves to a path containing a newline, which cannot be reported as an output"
          exit 1
        fi
        cd .spek-builder
        npx tsx scripts/build-demo.ts \
          --repo-dir "$REPO_DIR" \
          --output "$OUTPUT" \
          --title "$TITLE_INPUT"
        printf 'html-path=%s\n' "$OUTPUT" >> "$GITHUB_OUTPUT"

    - name: Generate badges
      id: badges
      if: ${{ inputs.generate-badges == 'true' }}
      shell: bash
      # Same rules as the build step: inputs through env, `--` for path utilities, and no newline
      # written to $GITHUB_OUTPUT.
      env:
        REPO_PATH_INPUT: ${{ inputs.repo-path }}
        OUTPUT_PATH_INPUT: ${{ inputs.output-path }}
      run: |
        REPO_DIR=$(realpath -- "$REPO_PATH_INPUT")
        BADGES_DIR=$(dirname -- "$OUTPUT_PATH_INPUT")/badges
        mkdir -p -- "$BADGES_DIR"
        BADGES_DIR=$(realpath -- "$BADGES_DIR")
        if [[ "$BADGES_DIR" == *$'\n'* ]]; then
          echo "::error::output-path resolves to a badges directory containing a newline, which cannot be reported as an output"
          exit 1
        fi
        cd .spek-builder
        npx tsx scripts/generate-badges.ts \
          --repo-dir "$REPO_DIR" \
          --output-dir "$BADGES_DIR"
        printf 'badges-path=%s\n' "$BADGES_DIR" >> "$GITHUB_OUTPUT"

    - name: Cleanup spek builder
      shell: bash
      run: rm -rf .spek-builder
